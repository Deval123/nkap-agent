# Layered over Nkap's compose.yaml by scripts/observe.sh. It shortens the reconciler so an
# unresolved payment escalates within seconds, and switches adjustments on. The request timeout
# the demo already sets is left alone.
#
# The one other change is the published host ports, 18080 and 18081 instead of 8080 and 8081,
# so a run does not collide with a demo stack that is already up on the usual ones.
#
# The project name differs from Nkap's own demo so a run never shares a database volume with
# a demo stack someone started by hand.
name: nkap-observe

services:
  simulator:
    ports: !override
      - "18081:8081"
  gateway:
    ports: !override
      - "18080:8080"
    environment:
      NKAP_RECONCILER_INTERVAL: PT1S
      NKAP_RECONCILER_BACKOFF_BASE: PT1S
      NKAP_RECONCILER_BACKOFF_MAX: PT2S
      NKAP_RECONCILER_WINDOW: PT5S
      NKAP_ADJUSTMENTS_ENABLED: "true"
